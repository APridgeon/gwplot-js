# Builds gwplot-js and runs its smoke test, on every push. The dependencies (Skia, HTSlib,
# xz) take most of the time; they're cached until gw's deps/wasm/build.sh or build_deps.sh
# change.
#
# Pushing a version tag (git tag v0.1.0 && git push origin v0.1.0) also publishes a
# release: the dependencies (gwplot-js-deps-<tag>.tar.gz, for building gwplot-js without
# building Skia), the module (gwplot-js-<tag>.tar.gz), the module as an npm package
# (gwplot-js-<version>.tgz) and their SHA256SUMS. A tag build always builds the
# dependencies afresh rather than from the cache.
name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    container: docker.io/emscripten/emsdk:3.1.65
    permissions:
      contents: write # to publish a release
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build tools
        run: apt-get update && apt-get install -y --no-install-recommends autoconf ninja-build

      - name: Cache the dependencies
        id: deps
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/cache@v4
        with:
          path: deps
          key: deps-${{ hashFiles('gw/deps/wasm/build.sh', 'build_deps.sh') }}

      - name: Build the dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        run: git config --global --add safe.directory '*' && ./build_deps.sh gw deps

      # A failed configure says why only in its config.log
      - name: Show the configure logs
        if: failure()
        run: |
          for log in gw/deps/wasm/xz-*/config.log gw/deps/wasm/htslib_src/config.log; do
            if [ -f "$log" ]; then echo "== $log"; tail -n 80 "$log"; fi
          done

      - name: Build
        run: ./build.sh gw deps out

      - name: Smoke test
        run: node tests/smoke.mjs out

      # On a tag, the tag's version (v0.1.0 -> 0.1.0); otherwise package.json's
      - name: Pack for npm
        run: |
          version=""
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then version="${GITHUB_REF_NAME#v}"; fi
          ./pack_npm.sh out "$version" release
        shell: bash

      # The smoke test again, on the package's own files
      - name: Test the npm package
        run: |
          mkdir -p /tmp/npm-package
          tar -xzf release/gwplot-js-*.tgz -C /tmp/npm-package
          node tests/smoke.mjs /tmp/npm-package/package

      - name: Check the TypeScript declarations
        run: >-
          npx --yes -p typescript@5 tsc --noEmit --strict --target es2022 --lib es2022,dom
          --module nodenext --moduleResolution nodenext tests/types.mts

      - name: Package the release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="$GITHUB_REF_NAME"
          mkdir -p release
          tar -czf "release/gwplot-js-deps-$tag.tar.gz" --transform "s,^deps,gwplot-js-deps-$tag," deps
          tar -czf "release/gwplot-js-$tag.tar.gz" --transform "s,^out,gwplot-js-$tag," out
          (cd release && sha256sum *.tar.gz *.tgz > SHA256SUMS)
          {
            echo "Built with Emscripten, from gw's deps/wasm/build.sh (its SHA-256 is gw_deps_build_sh):"
            echo
            echo '```'
            cat deps/BUILD_INFO
            echo '```'
            echo
            echo 'SHA-256:'
            echo
            echo '```'
            cat release/SHA256SUMS
            echo '```'
          } > release/NOTES.md

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          body_path: release/NOTES.md
          files: |
            release/*.tar.gz
            release/*.tgz
            release/SHA256SUMS
